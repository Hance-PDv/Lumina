name: Process Music & Generate Metadata

on:
  push:
    paths:
      - 'songs_input/**'

jobs:
  process-audio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mutagen pillow

      - name: Run Processing Script
        run: |
          python scripts/process_songs.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Lumina Automation Bot"
          git config --global user.email "bot@lumina.app"
          git add artwork/ tracks/ songs.json
          git status
          git diff-index --quiet HEAD || git commit -m "auto: extract artwork & update songs.json"
          git push
